spring:
  application:
    name: ai-service
  # ai-app 不使用数据库，排除 module-base-core 引入的 mybatis-plus/jdbc 数据源自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  cloud:
    nacos:
      # Maven 占位符，由 profile 控制（mac→127.0.0.1:8848 / windows、linux→172.16.8.70:8850）
      server-addr: @nacos.server-addr@
      username: @nacos.username@
      password: @nacos.password@
  ai:
    openai:
      api-key: 123456
      base-url: http://172.21.54.227:8000
      chat:
        options:
          model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
          temperature: 0.7
      # DeepSeek API 不支持 embedding，需禁用
      embedding:
        enabled: false

server:
  port: 19096

### log config ###
logging:
  file.name: logs/crabapples-ai/
  level:
    root: info
    org.springframework.ai: DEBUG
    cn.crabapples.ai: DEBUG
